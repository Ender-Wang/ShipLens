name: Release

# Builds and releases ShipLens artifacts to GitHub Releases, then updates the
# Homebrew tap (only when the CLI is part of the release).
#
# The three editions ship and version independently — they're separate
# platforms (Go binary, VSCode/Cursor extension, JetBrains plugin) and have
# no reason to march in lockstep. The release model is:
#
#   1. To ship an edition, bump *only* its version file:
#        - CLI       → packages/cli/cmd/shiplens/main.go        (var Version)
#        - VSCode    → packages/vscode-extension/package.json   ("version")
#        - JetBrains → packages/jetbrains-plugin/gradle.properties (pluginVersion)
#      to the same X.Y.Z value as the tag you'll cut.
#   2. Commit the bump(s) (alongside any source changes the release contains).
#   3. Push a single `vX.Y.Z` tag.
#
# CI then:
#   - For each edition: ships it iff its version file (a) moved between the
#     previous `v*` tag and the current one AND (b) currently equals X.Y.Z.
#   - Updates the Homebrew tap only if the CLI was shipped.
#
# Why version-file-move (and not "any source change"): the version file is
# the one path the maintainer deliberately moves at release time, so it's
# the cleanest possible signal of "ship this". A diff over all of
# `packages/<edition>/**` would re-flag every commit that touched the
# edition during the interval between tags, even ones that were prep for
# a future release.
#
# Edge cases:
#   - First release ever (no previous `v*` tag): every edition whose
#     version file currently equals X.Y.Z ships.
#   - Tag with no edition matching the rule: fail the run loudly — you've
#     tagged a no-op release.
#   - Version file moved in the diff but the new value isn't X.Y.Z:
#     treated as half-bumped prep for a *future* release, NOT shipped now.
#
# Marketplace publishes (VS Marketplace, Open VSX, JetBrains Marketplace)
# remain out-of-band — `vsce publish`, `ovsx publish`, `gradle publishPlugin`
# from a maintainer's machine. CI is the offline distribution path only.
#
# Idempotency: softprops/action-gh-release upserts at `tag_name`. Re-running
# the workflow on an existing tag updates the release assets in place.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release at (e.g. v0.1.3). Must already exist.'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release needs this to create releases

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      tag_version: ${{ steps.compute.outputs.tag_version }}
      build_cli: ${{ steps.compute.outputs.build_cli }}
      build_vscode: ${{ steps.compute.outputs.build_vscode }}
      build_jetbrains: ${{ steps.compute.outputs.build_jetbrains }}
      cli_version: ${{ steps.compute.outputs.cli_version }}
      vscode_version: ${{ steps.compute.outputs.vscode_version }}
      jetbrains_version: ${{ steps.compute.outputs.jetbrains_version }}
      release_notes: ${{ steps.compute.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history needed for `git diff <prev-tag>..<tag>`
          # workflow_dispatch checks out the default branch unless told
          # otherwise; for tag-push events we want the tagged SHA. The
          # expression below resolves to either the user-supplied tag or the
          # tag that triggered the workflow.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - id: compute
        run: |
          set -euo pipefail

          # 1. Resolve which tag we're releasing at.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided." >&2
            exit 1
          fi
          # Strip the `v` prefix to get the plain version.
          TAG_VERSION="${TAG#v}"

          # 2. Find the previous v* tag that's an ancestor of $TAG. Empty if
          #    this is the first release ever.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          echo "Previous tag: ${PREV_TAG:-<none — first release>}"

          # 3. Read each edition's current source-of-truth version.
          CLI_VERSION=$(grep '^var Version' packages/cli/cmd/shiplens/main.go \
            | sed 's/.*"\([^"]*\)".*/\1/')
          VSCODE_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          JETBRAINS_VERSION=$(grep '^pluginVersion' packages/jetbrains-plugin/gradle.properties \
            | sed 's/^pluginVersion[[:space:]]*=[[:space:]]*//')

          # 4. Decide which editions to ship. The rule: an edition ships in
          #    this release if and only if its version-file moved in
          #    PREV_TAG..TAG AND its current value equals TAG_VERSION.
          #
          #    Why this rule (and not "did any source file change"):
          #    diffing all of `packages/<edition>/**` is too broad — it
          #    flags every commit that touched the edition during the
          #    interval, even ones that were never meant for the current
          #    release. The version file is the one path the maintainer
          #    deliberately moves at release time, so it's the cleanest
          #    possible signal of "ship this".
          #
          #    Edge cases:
          #    - First release ever (no PREV_TAG): a version file is
          #      "moved" iff it currently equals TAG_VERSION.
          #    - Version file moved in the diff but the new value isn't
          #      TAG_VERSION: that's a half-bumped state for a future
          #      release; treat it as "not shipping" rather than failing,
          #      so prep work can sit on main without blocking releases.
          BUILD_CLI=false
          BUILD_VSCODE=false
          BUILD_JETBRAINS=false

          version_file_moved() {
            # Args: <path>
            # Returns 0 if the path changed in PREV_TAG..TAG (or no prev tag).
            local path="$1"
            if [ -z "$PREV_TAG" ]; then
              return 0
            fi
            git diff --name-only "${PREV_TAG}..${TAG}" -- "$path" | grep -q .
          }

          if version_file_moved 'packages/cli/cmd/shiplens/main.go' \
              && [ "$CLI_VERSION" = "$TAG_VERSION" ]; then
            BUILD_CLI=true
          fi
          if version_file_moved 'packages/vscode-extension/package.json' \
              && [ "$VSCODE_VERSION" = "$TAG_VERSION" ]; then
            BUILD_VSCODE=true
          fi
          if version_file_moved 'packages/jetbrains-plugin/gradle.properties' \
              && [ "$JETBRAINS_VERSION" = "$TAG_VERSION" ]; then
            BUILD_JETBRAINS=true
          fi

          if [ "$BUILD_CLI" = "false" ] && [ "$BUILD_VSCODE" = "false" ] && [ "$BUILD_JETBRAINS" = "false" ]; then
            echo "::error::Tag $TAG ships nothing. No edition has both (a) its version file moved since ${PREV_TAG:-<root>} and (b) a current value of $TAG_VERSION. Bump the version file of the edition you want to release and re-tag."
            exit 1
          fi

          # 6. Release notes: HEAD commit body (skip first two lines = subject + blank).
          NOTES=$(git log -1 --pretty=%B | tail -n +3 || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          {
            echo "tag=$TAG"
            echo "tag_version=$TAG_VERSION"
            echo "build_cli=$BUILD_CLI"
            echo "build_vscode=$BUILD_VSCODE"
            echo "build_jetbrains=$BUILD_JETBRAINS"
            echo "cli_version=$CLI_VERSION"
            echo "vscode_version=$VSCODE_VERSION"
            echo "jetbrains_version=$JETBRAINS_VERSION"
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: tag=$TAG tag_version=$TAG_VERSION"
          echo "Build flags: cli=$BUILD_CLI vscode=$BUILD_VSCODE jb=$BUILD_JETBRAINS"
          echo "Internal versions: cli=$CLI_VERSION vscode=$VSCODE_VERSION jetbrains=$JETBRAINS_VERSION"

  build-cli:
    needs: prepare
    if: needs.prepare.outputs.build_cli == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64, ext: tar.gz }
          - { goos: darwin,  goarch: amd64, ext: tar.gz }
          - { goos: linux,   goarch: arm64, ext: tar.gz }
          - { goos: linux,   goarch: amd64, ext: tar.gz }
          - { goos: windows, goarch: amd64, ext: zip    }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          cd packages/cli
          # main.go is the source of truth for the binary's reported version.
          # validate-versions has already confirmed it equals tag_version.
          VERSION="${{ needs.prepare.outputs.cli_version }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          BIN="shiplens"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN="shiplens.exe"
          fi

          mkdir -p out
          # -trimpath: reproducible builds. -s -w: smaller binary (strip debug).
          # -X main.Version baked at link time so `shiplens version` agrees
          # with what's printed on the release page (main.go is the source).
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o "out/$BIN" \
            ./cmd/shiplens

          ARCHIVE="shiplens-cli-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }}"

          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd out && zip -j "../$ARCHIVE" "$BIN")
          else
            tar -czf "$ARCHIVE" -C out "$BIN"
          fi

          # `<sha>  <filename>` form, matches `shasum -c` convention.
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            packages/cli/shiplens-cli-*.tar.gz
            packages/cli/shiplens-cli-*.zip
            packages/cli/shiplens-cli-*.sha256
          if-no-files-found: error
          retention-days: 7

  build-vscode:
    needs: prepare
    if: needs.prepare.outputs.build_vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build core
        run: npm run build --workspace @shiplens/core

      - name: Package extension
        run: npm run package --workspace shiplens

      - name: Rename to embed tag
        run: |
          set -euo pipefail
          cd packages/vscode-extension
          mv shiplens.vsix "shiplens-${{ needs.prepare.outputs.tag }}.vsix"
          ls -lh shiplens-*.vsix
          shasum -a 256 "shiplens-${{ needs.prepare.outputs.tag }}.vsix" \
            > "shiplens-${{ needs.prepare.outputs.tag }}.vsix.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: vscode-extension
          path: |
            packages/vscode-extension/shiplens-*.vsix
            packages/vscode-extension/shiplens-*.vsix.sha256
          if-no-files-found: error
          retention-days: 7

  build-jetbrains:
    needs: prepare
    if: needs.prepare.outputs.build_jetbrains == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: |
          set -euo pipefail
          cd packages/jetbrains-plugin

          # Override localIdePath (committed value points at /Applications which
          # doesn't exist on the runner). Empty value → conditional in
          # build.gradle.kts falls through to create() and downloads the
          # IntelliJ Platform from JetBrains.
          ./gradlew buildPlugin -PlocalIdePath= --no-daemon --stacktrace

          cd build/distributions
          # Plugin name is "ShipLens" (configurable in gradle.properties).
          # Use a glob to be tolerant of casing and version naming.
          ZIP=$(ls -1 *.zip | head -1)
          DEST="shiplens-jetbrains-${{ needs.prepare.outputs.tag }}.zip"
          mv "$ZIP" "$DEST"
          shasum -a 256 "$DEST" > "$DEST.sha256"
          ls -lh "$DEST" "$DEST.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: jetbrains-plugin
          path: |
            packages/jetbrains-plugin/build/distributions/shiplens-jetbrains-*.zip
            packages/jetbrains-plugin/build/distributions/shiplens-jetbrains-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build-cli, build-vscode, build-jetbrains]
    # Skipped jobs (editions whose source didn't change) don't trigger failure().
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected assets
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body: ${{ needs.prepare.outputs.release_notes }}
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-tap:
    needs: [prepare, release]
    # Update the Homebrew tap only when the CLI was rebuilt in this release.
    if: needs.prepare.outputs.build_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets to settle
        run: sleep 10

      - name: Fetch SHA256 sidecars
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          for PLATFORM in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            gh release download "$TAG" \
              --pattern "shiplens-cli-${TAG}-${PLATFORM}.tar.gz.sha256" \
              --repo "${{ github.repository }}"
          done
          {
            echo "darwin_arm64=$(awk '{print $1}' shiplens-cli-${TAG}-darwin-arm64.tar.gz.sha256)"
            echo "darwin_amd64=$(awk '{print $1}' shiplens-cli-${TAG}-darwin-amd64.tar.gz.sha256)"
            echo "linux_arm64=$(awk  '{print $1}' shiplens-cli-${TAG}-linux-arm64.tar.gz.sha256)"
            echo "linux_amd64=$(awk  '{print $1}' shiplens-cli-${TAG}-linux-amd64.tar.gz.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Formula and push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.cli_version }}
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Ender-Wang/homebrew-tap.git" tap
          cd tap

          mkdir -p Formula
          cat > Formula/shiplens.rb <<RUBY
          # This file is auto-generated by ShipLens release CI.
          # Do not edit by hand — see .github/workflows/release.yml in
          # https://github.com/Ender-Wang/ShipLens.
          class Shiplens < Formula
            desc "First release version of every line of code, inline in your terminal"
            homepage "https://github.com/Ender-Wang/ShipLens"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Ender-Wang/ShipLens/releases/download/${TAG}/shiplens-cli-${TAG}-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              else
                url "https://github.com/Ender-Wang/ShipLens/releases/download/${TAG}/shiplens-cli-${TAG}-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Ender-Wang/ShipLens/releases/download/${TAG}/shiplens-cli-${TAG}-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              else
                url "https://github.com/Ender-Wang/ShipLens/releases/download/${TAG}/shiplens-cli-${TAG}-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "shiplens"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/shiplens version")
            end
          end
          RUBY

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/shiplens.rb

          if git diff --cached --quiet; then
            echo "Formula already up to date for $TAG, nothing to commit."
            exit 0
          fi

          git commit -m "Update ShipLens to ${TAG}"
          git push
