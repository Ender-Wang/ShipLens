## Plugin identity (kept in sync with packages/vscode-extension/package.json where it makes sense).
pluginGroup = com.shiplens
pluginName = ShipLens
## Aligned with the VSCode edition. Both plugins advance together; this
## edition's first marketplace release starts at 0.1.2 for cross-platform
## version-line parity.
pluginVersion = 0.1.2

## IntelliJ Platform target. 2025.2 (build 252.*) chosen as a comfortable floor —
## first version line that mandates JBR 21, which lets us compile with JDK 21
## and use modern Kotlin without runtime-class-file-version mismatches.
## Covers: IntelliJ IDEA 2025.1+ (and Community), PyCharm, GoLand, WebStorm,
## RubyMine, Android Studio Narwhal+.
platformType = IU
platformVersion = 2025.2
sinceBuild = 251
untilBuild = 261.*

## Path to a locally-installed JetBrains IDE — used to skip the platform download.
## macOS examples:
##   /Applications/IntelliJ IDEA.app/Contents               (Ultimate, /Applications)
##   /Applications/IntelliJ IDEA CE.app/Contents            (Community)
##   ~/Applications/JetBrains Toolbox/IntelliJ IDEA Ultimate/IntelliJ IDEA.app/Contents  (Toolbox)
## If empty, the build downloads the platform specified by `platformType`/`platformVersion` above.
localIdePath = /Applications/IntelliJ IDEA.app/Contents

## Targets
javaVersion = 21
kotlinVersion = 2.2.0

## Gradle daemon settings
org.gradle.jvmargs = -Xmx2g -XX:+UseG1GC
org.gradle.caching = true
org.gradle.parallel = true
kotlin.stdlib.default.dependency = false
